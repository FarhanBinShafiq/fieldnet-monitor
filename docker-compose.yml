services:
  db:
    image: postgres:16-alpine
    container_name: fieldnet_db
    environment:
      POSTGRES_DB: fieldnet
      POSTGRES_USER: fieldnet
      POSTGRES_PASSWORD: fieldnet_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldnet -d fieldnet"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fieldnet_backend
    environment:
      - DEBUG=1
      - DB_NAME=fieldnet
      - DB_USER=fieldnet
      - DB_PASSWORD=fieldnet_secret
      - DB_HOST=db
      - DB_PORT=5432
      - TEST_MODE=0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fieldnet_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
